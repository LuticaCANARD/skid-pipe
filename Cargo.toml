[package]
name = "skid-pipe"
version = "0.2.1"
edition = "2024"
description = "Reusable, state-capable static computation pipelines for Rust core"
license = "MIT"
readme = "README.md"
repository = "https://github.com/LuticaCANARD/skid-pipe"
homepage = "https://github.com/LuticaCANARD/skid-pipe"
documentation = "https://docs.rs/skid-pipe"
keywords = ["pipeline", "compose", "no-std", "embedded", "wasm"]
categories = ["no-std", "wasm"]
rust-version = "1.86"

[lib]
path = "src/lib.rs"

[features]
default = []
# Runs the impl ladder to 32 stages per group instead of 16. A group's stages
# share one `async` block and rustc overlaps their futures into one slot, so a
# wider group means a flatter, smaller run future: a 100-stage chain costs
# 364.11 ns rather than 385 and its future 72 B rather than 120 B. The crate's
# own compile time is roughly five times higher. Only chains longer than 16
# stages see any difference. Enabling it anywhere enables it everywhere, so it
# stays additive under feature unification. The ladder stops here: at 64 the
# macro needs a raised `recursion_limit` and the crate takes 65 s to build.
wide = []
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1.53", default-features = false, features = ["rt"], optional = true }

[dev-dependencies]
criterion = "=0.8.2"
# Benchmark-only. `default-features = false` keeps the comparison on the
# core-only combinators, matching this crate's no_std, no-alloc default.
futures = { version = "0.3", default-features = false }
# `tower` is deliberately benchmark-only: it models request/response services,
# not this crate's no_std function composition API.
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "composition"
harness = false

[[bench]]
name = "diagnose"
harness = false

[[bench]]
name = "vs_futures"
harness = false

[[bench]]
name = "vs_tower"
harness = false
