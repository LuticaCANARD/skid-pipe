[package]
name = "skid-pipe"
version = "0.2.1"
edition = "2024"
description = "Reusable, state-capable static computation pipelines for Rust core"
license = "MIT"
readme = "README.md"
repository = "https://github.com/LuticaCANARD/skid-pipe"
homepage = "https://github.com/LuticaCANARD/skid-pipe"
documentation = "https://docs.rs/skid-pipe"
keywords = ["pipeline", "compose", "no-std", "embedded", "wasm"]
categories = ["no-std", "wasm"]
rust-version = "1.86"

[lib]
path = "src/lib.rs"

[features]
default = []
# Builds each link future's tail on its first poll instead of when the run
# future is created. Creating a 100-stage run future drops from 9.8489 ns to
# 1.2309 ns, and one dropped before its first poll becomes O(1); the work moves
# into `poll`, where the extra state per layer costs more than it saved. See
# "Rejected optimizations" in BENCHMARKS.md for the full trade. Off by default:
# the default build optimizes end-to-end latency.
lazy-construction = []
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1.53", default-features = false, features = ["rt"], optional = true }

[dev-dependencies]
criterion = "=0.8.2"
# Benchmark-only. `default-features = false` keeps the comparison on the
# core-only combinators, matching this crate's no_std, no-alloc default.
futures = { version = "0.3", default-features = false }
# `tower` is deliberately benchmark-only: it models request/response services,
# not this crate's no_std function composition API.
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "composition"
harness = false

[[bench]]
name = "diagnose"
harness = false

[[bench]]
name = "vs_futures"
harness = false

[[bench]]
name = "vs_tower"
harness = false
