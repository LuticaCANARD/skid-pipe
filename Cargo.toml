[package]
name = "skid-pipe"
version = "0.1.0"
edition = "2024"
description = "Reusable, state-capable static computation pipelines for Rust core"
license = "MIT OR Apache-2.0"
keywords = ["pipeline", "compose", "no-std", "embedded", "wasm"]
categories = ["no-std", "wasm"]
rust-version = "1.86"

[lib]
path = "src/lib.rs"

[dev-dependencies]
criterion = "=0.8.2"

[[bench]]
name = "composition"
harness = false
